[project]
name = "securitydrone"
version = "0.1.0"
description = "Security drone surveillance system with wake-up triggers, suspect detection, tracking, and coordinate reporting"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "pymavlink>=2.4.0",
]

[project.optional-dependencies]
vision = [
    "ultralytics>=8.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
securitydrone = "main:main"
